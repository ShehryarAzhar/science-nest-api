{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Science Nest: friendly one-to-one science tutoring." />
    <title>Science Nest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%236366f1' stroke-width='4'%3E%3Cellipse cx='32' cy='32' rx='26' ry='10'/%3E%3Cellipse cx='32' cy='32' rx='26' ry='10' transform='rotate(60 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='26' ry='10' transform='rotate(120 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5' fill='%2314b8a6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="{% static 'core/styles.css' %}" />
  </head>
  <body>
    <div class="blob blob--indigo" aria-hidden="true"></div>
    <div class="blob blob--teal" aria-hidden="true"></div>

    <main class="card">
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Science Nest logo">
        <g fill="none" stroke="currentColor" stroke-width="3">
          <ellipse cx="32" cy="32" rx="26" ry="10" />
          <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(60 32 32)" />
          <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(120 32 32)" />
        </g>
        <circle class="logo__core" cx="32" cy="32" r="5" />
      </svg>

      <h1>Science Nest</h1>
      <p class="tagline">Friendly one-to-one science tutoring</p>

      <ul class="chips">
        <li>Weekly classes</li>
        <li>Free trial lesson</li>
        <li>O Level to University</li>
      </ul>

      <div class="actions">
        <a class="button button--primary" href="{{ frontend_url }}">Visit Science Nest</a>
        <a class="button button--secondary" href="{% url 'admin:index' %}">Admin</a>
      </div>

      <footer>Science Nest API · &copy; {% now "Y" %}</footer>
    </main>
  </body>
</html>
