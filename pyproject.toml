[project]
name = "science-nest-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-rest-framework>=0.1.0",
    "djangorestframework-simplejwt>=5.5.1",
    "djoser>=2.3.4",
    "mysqlclient>=2.3.0",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "model-bakery>=1.24.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
